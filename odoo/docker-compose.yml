# Odoo de test + 2 tunnels publics (l'agent H tourne dans le cloud, il ne voit pas localhost)
#   tunnel       → Odoo                    (URL à copier dans ODOO_URL)
#   tunnel-files → images des factures     (URL à copier dans INVOICE_BASE_URL)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on: [db]
    ports:
      - "${ODOO_PORT:-8069}:8069"   # accès local : http://localhost:8069
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo

  tunnel:
    image: cloudflare/cloudflared:latest
    depends_on: [odoo]
    # http2 : passe sur les réseaux qui bloquent QUIC/UDP (wifi d'école, hackathon)
    command: tunnel --no-autoupdate --protocol http2 --url http://odoo:8069

  # Sert les factures en PNG pour que l'agent les ouvre dans un onglet (python -m som factures-png)
  files:
    image: nginx:alpine
    volumes:
      - ../data/factures_png:/usr/share/nginx/html:ro

  tunnel-files:
    image: cloudflare/cloudflared:latest
    depends_on: [files]
    command: tunnel --no-autoupdate --protocol http2 --url http://files:80

volumes:
  db-data:
  odoo-data:
