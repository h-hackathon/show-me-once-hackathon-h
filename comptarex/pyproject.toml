[project]
name = "comptarex"
version = "0.1.0"
description = "Faux logiciel de comptabilité de cabinet (cible de test des agents H) : site web + application de bureau"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
desktop = ["pyside6>=6.8"]

[project.scripts]
comptarex-web = "comptarex.web.app:main"
comptarex-desktop = "comptarex.desktop.app:main"
comptarex-admin = "comptarex.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comptarex"]
