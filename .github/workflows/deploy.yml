# À chaque fusion sur main : tests des tools modifiés (filet de sécurité), puis un service Railway par tool.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tools:
        description: "Tools à redéployer, séparés par des espaces (vide = tous)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAILWAY_CLI_VERSION: "5.2.0"   # 5.3.0 a cassé `railway up` en CI : on épingle
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      SMO_SERVER_URL: ${{ secrets.SMO_SERVER_URL }}
      SMO_SERVER_TOKEN: ${{ secrets.SMO_SERVER_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tools à déployer
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.tools }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tools=${ONLY:-$(bash scripts/changed_tools.sh "" | xargs)}
          else
            tools=$(bash scripts/changed_tools.sh "$BEFORE" | xargs)
          fi
          echo "à déployer : ${tools:-aucun}"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
      - name: uv (depuis PyPI : setup-uv passe par les releases GitHub)
        if: steps.changed.outputs.tools != ''
        run: pipx install uv
      - name: Tests (Devin a pu fusionner en rouge)
        if: steps.changed.outputs.tools != ''
        env:
          TOOLS: ${{ steps.changed.outputs.tools }}
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
          uv run pytest $(for n in $TOOLS; do printf 'tools/%s ' "$n"; done)
      # Le paquet npm télécharge le binaire depuis les releases GitHub, qui ont renvoyé 504 pendant des heures le
      # 08/11 : on le prend dans l'image du CLI sur ghcr.io (binaire statique). Même raison pour uv, pris sur PyPI.
      - name: CLI Railway
        if: steps.changed.outputs.tools != ''
        run: |
          docker create --name railway-cli "ghcr.io/railwayapp/cli:$RAILWAY_CLI_VERSION" > /dev/null
          sudo docker cp railway-cli:/usr/bin/railway /usr/local/bin/railway
          docker rm railway-cli > /dev/null
          railway --version
      - name: Déploiement
        if: steps.changed.outputs.tools != ''
        env:
          TOOLS: ${{ steps.changed.outputs.tools }}
        run: for n in $TOOLS; do bash scripts/deploy_tool.sh "$n"; done
