<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Show Me Once — Recorder</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaed; --muted:#9aa0a6; --accent:#7c5cff; --rec:#ea4335; --ok:#34a853; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; justify-content:center; padding:40px 16px; }
    main { width:100%; max-width:640px; }
    h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 24px; }
    .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; }
    button { font:inherit; border:0; border-radius:8px; padding:12px 18px; cursor:pointer; background:var(--accent); color:#fff; font-weight:600; }
    button.stop { background:var(--rec); } button:disabled { opacity:.5; cursor:default; }
    label { display:flex; gap:8px; align-items:center; margin:6px 0; color:var(--muted); }
    #status { font-weight:600; } .rec { color:var(--rec); } .ok { color:var(--ok); }
    #log { max-height:260px; overflow:auto; font:12px/1.5 ui-monospace, monospace; color:var(--muted); white-space:pre-wrap; }
    video { width:100%; border-radius:8px; background:#000; margin-top:12px; display:none; }
    a { color:var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Show Me Once</h1>
  <p class="sub">Fais ta tâche une seule fois. On capture l'écran, tes clics et ta voix.</p>

  <div class="card">
    <input id="taskTitle" placeholder="Nom de la tâche (ex : Traiter un litige Stripe)" style="width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#e8eaed;margin-bottom:8px">
    <textarea id="taskGoal" rows="2" placeholder="Objectif (ex : vérifier si la commande liée au litige a été livrée et répondre au litige avec les preuves)" style="width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#e8eaed;margin-bottom:8px;font:inherit"></textarea>
    <label><input type="checkbox" id="mic" checked> Enregistrer le micro (narration → Gladia)</label>
    <label><input type="checkbox" id="sysaudio"> Inclure le son du système / de l'onglet</label>
    <div style="margin-top:14px; display:flex; gap:10px;">
      <button id="start">Choisir l'écran et démarrer</button>
      <button id="stop" class="stop" disabled>Arrêter et envoyer</button>
    </div>
    <p>Statut : <span id="status">prêt</span> — <span id="counter">0 événement</span></p>
    <p style="color:var(--muted); font-size:13px; margin:0">Conseil : choisis « Écran entier » pour suivre tes passages d'onglet en onglet. Laisse cet onglet épinglé ouvert pendant l'enregistrement.</p>
    <video id="preview" muted autoplay></video>
  </div>

  <div class="card">
    <div id="result"></div>
    <div id="log"></div>
  </div>
</main>
<script src="recorder.js"></script>
</body>
</html>
