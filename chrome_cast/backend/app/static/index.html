<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Me Once</title>
<style>
  body { margin:0; padding:24px 16px; font:14px/1.5 system-ui, sans-serif; background:#0f1115; color:#e8eaed; }
  main { max-width:800px; margin:auto; }
  a.rec { display:block; background:#181b22; border-radius:10px; padding:14px 16px; margin-bottom:10px; color:inherit; text-decoration:none; }
  a.rec:hover { background:#1e222b; }
  .muted { color:#9aa0a6; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Show Me Once — enregistrements</h1>
  <div id="list" class="muted">Chargement…</div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
fetch("/recordings").then((r) => r.json()).then((items) => {
  document.getElementById("list").innerHTML = items.length ? items.map((r) => `
    <a class="rec" href="/viewer/${esc(r.id)}">
      <b>${esc(r.title || r.id)}</b><br>
      <span class="muted">${esc(r.id)} · ${esc(r.status)} · ${esc((r.apps || []).join(" → "))}</span>
    </a>`).join("") : "Aucun enregistrement pour l'instant. Lance l'extension Chrome.";
});
</script>
</body>
</html>
